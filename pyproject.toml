[project]
name = "flawchess"
version = "0.1.0"
description = "Multi-user chess analysis platform with Zobrist hash position matching"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "chess>=1.10.0",
    "pydantic>=2.0.0",
    # Floor is 2.31 (>= 1.106, which fixed CVE-2026-54249); do not lower below 1.106.
    "pydantic-ai-slim[anthropic,google]>=2.53,<3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi-users[oauth,sqlalchemy]>=15.0.4",
    "httpx-oauth>=0.16.1",
    "sentry-sdk[fastapi]>=2.54.0",
    "genai-prices>=0.1.3,<0.2.0",
    # Bug fix (Sentry FLAWCHESS-9W): the pinned python:3.14-slim runtime base image
    # ships a trimmed system tzdata with no `backward` compatibility links, so legacy
    # IANA aliases (e.g. Europe/Kiev) raised ZoneInfoNotFoundError in prod only.
    # zoneinfo searches system TZPATH first and falls back to this package, so it
    # fills the gap without overriding system zones. Lives in [project] dependencies
    # (not a group) so both Dockerfile and Dockerfile.worker pick it up from one edit.
    "tzdata",
]

[dependency-groups]
dev = [
    "complexipy>=7.0.1",
    "pillow>=12.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4.0",
    "ty>=0.0.26",
    "zstandard>=0.22",
]
# Isolated group for backend Maia-3 ONNX inference (Phase 174, GEMS-06). Kept OUT
# of [project.dependencies] on purpose: that set is shared with the lean remote-worker
# image (Dockerfile.worker), which must never pull onnxruntime/numpy. Only the backend
# Dockerfile opts in via `uv sync --group maia-inference`.
maia-inference = [
    # PIN EXACTLY 1.29.0 — never a range. onnxruntime>=1.22 SEGFAULTED on the vendored
    # maia3_simplified.onnx model at older versions (verified repro in
    # .planning/notes/2026-07-10-flawchess-engine-self-execution-analysis.md, Pitfall 2).
    # Any future bump MUST re-run scripts/maia_parity_spike.py before merging.
    #
    # History: 2026-07-16 measured onnxruntime 1.20.1 as the last known-safe version
    # (max per-ply drift 0.003844, evidence in
    # scripts/maia_parity_spike.py's PARITY_EPSILON comment block).
    #
    # Phase 218 measured onnxruntime 1.29.0 in an isolated `uv run --no-project`
    # environment (2026-09-05): PASS, no segfault, max per-ply drift 0.004237
    # (within PARITY_EPSILON=0.010). Evidence:
    # .planning/phases/218-backend-onnxruntime-parity-spike-python-3-14-chain/
    # 218-evidence-onnxruntime-1.29.0-python.txt. Pin raised to 1.29.0 to unblock the
    # Python 3.14 chain (218-02).
    "onnxruntime==1.29.0",
    "numpy",
]
# Isolated group for the backend Web Push send path (Phase 201, PUSH-05). Kept OUT
# of [project.dependencies] on purpose: that set is shared with the lean remote-worker
# image (Dockerfile.worker), which must never pull the push stack. Only the backend
# Dockerfile opts in via `uv sync --group push`.
#
# There is no third-party web-push package here: `app/services/push_crypto.py`
# vendors the ~110 lines we need (MIT, from webpush-py 1.0.6) and depends only on
# these two, both of which already resolve into the base tree anyway. Declared
# explicitly because push_crypto imports them directly. See that module's
# docstring for why vendoring beat the dependency, and
# tests/services/test_push_crypto.py for the differential test that pinned it.
push = [
    "cryptography>=50.0.0",
    "pyjwt>=2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Benchmark numeric-regression tests hit the heavy benchmark DB (port 5433) and
# are slow by design; excluded from normal runs. Run on demand with an explicit
# path (overrides this ignore): uv run pytest tests/scripts/benchmarks
# Tagger precision/recall harness runs hundreds of puzzles through the detector
# and is slow by design; excluded from normal runs. Run on demand or in CI with
# an explicit path (overrides this ignore): uv run pytest tests/scripts/tagger
addopts = "--ignore=tests/scripts/benchmarks --ignore=tests/scripts/tagger"

[tool.ruff]
line-length = 100
# analysis/tilt_study/probes/ holds notebook-style REPL snippets that reuse the marimo
# notebook's globals (F821 everywhere); they are scratch probes, not modules.
# .planning/research/perf-profiling-* holds throwaway profiling scripts kept for re-measurement.
extend-exclude = ["analysis/tilt_study/probes", ".planning/research/perf-profiling-*"]

[tool.ruff.lint]
# Explicit `select` pins the rule set that was ruff's own implicit default under
# ruff 0.15.15 (E4/E7/E9/F, ~62 rules with zero project config — verified via
# `ruff check --isolated`). ruff 0.16.6 (216-03 catch-up) expanded its own
# unconfigured default to ~419 rules (adds bandit S, bugbear B, datetimez DTZ,
# simplify SIM, tryceratops TRY, refurb FURB, and more), which would otherwise
# have silently surfaced ~2200 new findings across ~380 files on this bump —
# far outside a no-behavior-change dependency catch-up's scope. Pinning keeps
# ruff's OWN default drift from silently expanding what CI lints on every
# future ruff release; adopting a new rule category is a deliberate future
# decision, not an accident of a patch bump.
select = ["E4", "E7", "E9", "F"]
# Ruff's complexity-count rules (cyclomatic/branch/statement counters) are deliberately
# not enabled: nesting depth (scripts/check_function_size.py) is the only hard
# complexity gate this project runs (quick 260926-evd, D-03).
#
# TID251, B, ASYNC and DTZ were adopted deliberately on 2026-09-26 (quick 260926-evd),
# scoped per the per-file-ignores comment below.
extend-select = ["TID251", "B", "ASYNC", "DTZ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "blocks the event loop, use httpx.AsyncClient" }
"berserk" = { msg = "use httpx.AsyncClient against the lichess API" }
# datetime's `now`/`utcnow` are NOT banned here: tz-aware `datetime.now(timezone.utc)`
# has legitimate use (app/middleware/last_activity.py, import-job and eval-lease code);
# the naive form is caught by DTZ005 once DTZ is enabled below, and the
# endpoint-only dev_now_utc convention is not expressible as an API ban.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are re-evaluated per-request by FastAPI
# itself, not shared mutable state, so B008 (function-call-in-default-argument) is
# a false positive for these. Clears ~60 pre-existing findings.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]  # SQLAlchemy forward references in relationship() strings
"alembic/versions/*.py" = ["F401"]  # Alembic auto-imports sa/op that may appear unused
# B, ASYNC and DTZ target app/ code (Quick 260926-evd, D-02). scripts/, analysis/ and
# alembic/ ignore all three (CLI/research/migration code: blocking file I/O and naive
# local dates are fine there, zip over known-equal sequences is noise). tests/ ignores
# ASYNC, DTZ and B905 (async tests do blocking fixture I/O by design; naive fixture
# datetimes; zip over fixture pairs), but bugbear otherwise stays on for tests because
# B017/B904/B007 catch real test bugs. TID251 applies everywhere (no ignore needed).
"scripts/**" = ["B", "ASYNC", "DTZ"]
"analysis/**" = ["B", "ASYNC", "DTZ"]
"alembic/**" = ["B", "ASYNC", "DTZ"]
"tests/**" = ["ASYNC", "DTZ", "B905"]
# Quick 260926-evd baseline (measured 2026-09-26, ruff 0.16.6): pre-existing findings
# in newly adopted categories. Delete an entry when its file is fixed; never add one
# for new code.
"tests/repositories/test_opening_insights_repository.py" = ["B007"]
"tests/services/test_push_crypto.py" = ["B017"]
"tests/test_eval_worker_endpoints.py" = ["B017"]
"tests/test_main_lifespan.py" = ["B904"]
# The setattr calls deliberately bypass ty: converting to plain attribute assignment
# was verified to produce a ty invalid-assignment error on the alembic.context proxy,
# so never autofix this entry.
"tests/test_alembic_autogen_filter.py" = ["B010"]
"app/services/engine.py" = ["ASYNC109"]
"app/services/normalization.py" = ["DTZ007"]

[tool.ty.environment]
# Scripts in scripts/ are run as `python scripts/foo.py`, so sibling modules
# resolve via sys.path[0] at runtime. ty has no such implicit path, so
# scripts/ importing scripts/ reads as unresolved-import without this.
extra-paths = ["scripts"]

# analysis/ is a deliberately standalone uv project with its own venv (see
# analysis/pyproject.toml), so its marimo/polars/plotly/psycopg imports cannot
# resolve against the ROOT .venv. Exclude the tree instead of pointing
# extra-paths at analysis/.venv: ty validates every extra-paths entry at
# startup and hard-fails ("does not point to a directory") when one is missing,
# which broke CI — the runner never creates analysis/.venv. The old comment
# claiming this only affected the IDE was wrong; the failure is independent of
# which paths you ask ty to check.
#
# analysis/ IS type checked, just not from here: CI runs a separate
# `uv run --project analysis --with ty ty check analysis/` step against that
# project's own environment, where the imports resolve. This exclude only keeps
# a root-level `ty check .` from reporting the whole tree as unresolved.
[tool.ty.src]
# analysis/tilt_study/probes/ holds notebook-style REPL snippets that reuse the marimo
# notebook's globals; scratch probes, not modules (also excluded from ruff above).
exclude = ["analysis", "analysis/tilt_study/probes"]

[tool.ty.rules]
# Warn on unused suppression comments so stale ignores don't accumulate
unused-ignore-comment = "warn"
